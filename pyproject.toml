[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cnc-guard"
version = "0.1.0"
description = "Demo académica de mantenimiento industrial - Erronka 1"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "streamlit>=1.40,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "scipy>=1.15,<2", "pypdf>=5,<7", "pyarrow>=19,<25"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2", "httpx>=0.28,<1"]

[project.scripts]
cnc-guard = "cnc_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
